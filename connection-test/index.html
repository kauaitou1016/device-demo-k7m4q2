<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'sha256-1CoRdKRD8dMf8yh46v3OaWnfEMqiTY5BCDYG0+o8fFI=' https://accounts.google.com/gsi/client; style-src 'unsafe-inline'; connect-src https://accounts.google.com https://oauth2.googleapis.com https://www.googleapis.com https://sheets.googleapis.com; frame-src https://accounts.google.com; base-uri 'none'; form-action https://accounts.google.com"><title>Googleシート接続テスト</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#233b3d;background:#edf1f0;font-size:16px}*{box-sizing:border-box}body{margin:0}main{max-width:480px;margin:auto;padding:16px}header{background:#263d3f;color:white;padding:22px;border-radius:16px}h1{font-size:25px;margin:0 0 12px}h2{font-size:20px;margin:0 0 14px}section{background:white;border-radius:16px;padding:18px;margin-top:16px}p{line-height:1.6;margin:10px 0}button{min-height:48px;border:1px solid #b6c7c4;border-radius:12px;padding:10px 14px;background:white;color:#29494b;font:inherit;cursor:pointer}button:disabled{opacity:.45;cursor:default}.primary,button[aria-pressed=true]{background:#355c60;color:white}.wide{width:100%;margin:6px 0}.big{min-height:60px;font-weight:bold;font-size:19px}.chips{display:flex;gap:8px;flex-wrap:wrap}.chips button{flex:1 1 120px}.small{font-size:13px;color:#536a6b}.notice{background:#fff0dc;padding:12px;border-radius:10px}#message{white-space:pre-wrap;overflow-wrap:anywhere}article{padding:12px;border:1px solid #ccd8d5;border-radius:12px;margin:10px 0;overflow-wrap:anywhere}article.other{background:#e5eff9;border-left:5px solid #426d92}article p{margin:3px 0}.wrap{overflow-wrap:anywhere}label{display:flex;gap:10px;align-items:center;min-height:48px}input{width:22px;height:22px}textarea{width:100%;min-height:180px;font:inherit;padding:10px}#status{white-space:pre-line;overflow-wrap:anywhere}code{font-size:12px;overflow-wrap:anywhere} [hidden]{display:none!important}
</style></head><body><main><header><h1>Googleシート接続テスト</h1><p>テスト用の1行を保存し、別のスマホから見えるか確認します。</p><p id="setup" class="notice" style="color:#233b3d"></p></header>
<section><h2>1. 端末と回線</h2><div id="devices" class="chips"></div><p>回線</p><div id="networks" class="chips"></div></section>
<section><h2>2. ログイン</h2><button id="popup" class="wide primary">ログイン（ポップアップ）</button><button id="redirect" class="wide">ログイン（画面切替）</button><p id="status"></p><button id="logout">ログアウト</button><p class="small">ログアウトはこのページのトークンを破棄します。Google自体からはログアウトしません。</p></section>
<section><h2>3. 書き込みテスト</h2><p>患者情報は入力しません。メール・端末・回線・時刻などのテスト情報を保存します。</p><button id="write" class="wide primary big">1行書き込む</button><button id="resume" class="wide" hidden>再ログインして書き込みを続ける</button><p id="message" role="status" aria-live="polite"></p></section>
<section><h2>4. 読み込みテスト</h2><button id="read" class="wide">読み込む</button><label><input id="auto" type="checkbox">60秒ごとに自動で読み込む</label><p class="small">最新20行を新しい順に表示。別のメールの行は青色です。同じアカウントの別端末は端末欄で確認してください。</p><div id="rows"></div></section>
<section><h2>5. 結果のコピー</h2><p class="small">端末・回線・方式・成功／失敗・エラーコードをコピーします。トークンは含みません。</p><button id="copy" class="wide">結果をコピー</button><textarea id="report" readonly hidden aria-label="コピー用の結果"></textarea></section></main>
<script>
'use strict';
const CONFIG={clientId:'',spreadsheetId:'',sheetName:'接続テスト',scopes:'https://www.googleapis.com/auth/spreadsheets https://www.googleapis.com/auth/userinfo.email',pollSeconds:60};
const VERSION='connection-0.1', Q=new URLSearchParams(location.search), MOCK=Q.get('mock')==='1';
const PREFIX='cath-connection-test-v1-'+(MOCK?'mock':'real')+'-', $=id=>document.getElementById(id);
const HEADERS=['記録日時','テストID','ログインメール','端末','回線','ログイン方式','ページ版','ブラウザ情報'];
const DEVICES=['iPhone・Safari','iPhone・ホーム画面','Android・Chrome','PC'],NETWORKS=['院内Wi-Fi','モバイル回線'];
const jpTime=()=>new Date(Date.now()+32400000).toISOString().replace('Z','+09:00');
const uuid=()=>crypto.randomUUID();
const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let storeOK=true;
function get(k,fallback=null){try{const v=sessionStorage.getItem(PREFIX+k);return v?JSON.parse(v):fallback}catch{return fallback}}
function put(k,v){try{if(v===null)sessionStorage.removeItem(PREFIX+k);else sessionStorage.setItem(PREFIX+k,JSON.stringify(v));return true}catch{storeOK=false;return false}}
let token=get('token'),pending=get('pending'),events=get('events',[]),device=get('device',''),network=get('network',''),method=get('method','popup'),busy=false,authBusy=false,gis=null,rows=[],autoTimer=null;
if(token&&(token.clientId!==CONFIG.clientId||token.spreadsheetId!==CONFIG.spreadsheetId)){token=null;put('token',null)}
const configured=()=>MOCK||!!(CONFIG.clientId&&CONFIG.spreadsheetId);
const valid=()=>!!(token&&token.accessToken&&token.expiresAt>Date.now()+2000);
const methodName=m=>m==='redirect'?'画面切替':'ポップアップ';
function record(action,ok,code=''){events.push({time:jpTime(),action,ok,code:normalizeCode(code),device,network,method:methodName(method)});events=events.slice(-150);put('events',events)}
function normalizeCode(code){return String(code||'').replace(/[^a-zA-Z0-9_. -]/g,'').slice(0,100)}
function explanation(code){const c=String(code);if(/admin_policy_enforced|org_internal/.test(c))return '病院アカウントの管理設定で、このアプリへの接続が止められています。この方式は使えません（結果に記録してください）。';if(c==='access_denied')return '許可が拒否されたか、このアカウントがテスト利用者に登録されていない可能性があります。テスト利用者の設定を確認してください。';if(/popup_closed|cancel/.test(c))return 'ログインが中断されました。もう一度お試しください。';if(c==='popup_failed_to_open')return 'ポップアップが開けません。「画面切替」で試してください。';if(/redirect_uri_mismatch|origin_mismatch/.test(c))return '接続設定のURLが一致していません（準備手順の5を確認）。';if(/SERVICE_DISABLED|ACCESS_TOKEN_SCOPE_INSUFFICIENT/.test(c))return 'Sheets APIの有効化またはログイン時の許可が不足しています。Google Cloudの設定と許可した項目を確認してください。';if(c==='403'||c==='PERMISSION_DENIED')return 'このシートへのアクセス権限がありません。書き込みには編集権限が必要です。シートの持ち主に共有を依頼してください。';if(c==='404'||c==='NOT_FOUND'||c==='400'||c==='INVALID_ARGUMENT')return 'シートが見つからないか、範囲が正しくありません。シートIDとタブ名を確認してください。';if(c==='401'||c==='UNAUTHENTICATED')return 'ログインの有効期限が切れました。再ログインして続けてください。';if(c==='state_mismatch')return 'ログインの戻り先を確認できませんでした。もう一度、この画面のログインボタンから始めてください。';if(c==='missing_header')return '見出し行がありません、または見出しが一致しません。準備手順の1に沿ってA1〜H1を確認してください。';if(c==='storage_unavailable')return 'このタブに一時保存できません。通常のブラウザのタブで開き直してください。';if(c==='gis_not_ready')return 'ログインの準備ができていません。少し待ってもう一度押すか、画面切替で試してください。';if(c==='missing_scope')return '必要な許可が揃っていません。シートの読み書きとメールアドレスの許可を確認してください。';if(c==='network_error')return '通信できません。Wi-Fiまたはモバイル回線を確認してください。';if(c==='uncertain_write')return '保存結果を確認できません。まず「読み込む」でテストIDを確認してください。重複を避けるため、自動で再送していません。';return '処理できませんでした。下のエラーコードを結果に記録してください。'}
function error(code,action='処理'){const c=normalizeCode(code);$('message').textContent=explanation(c)+'\nコード：'+c;record(action,false,c);renderStatus()}
function renderStatus(){const enabled=configured();$('setup').textContent=MOCK?'モック：Googleへ通信しません。別端末とは共有されません。':enabled?'テスト用シートにのみ接続します。':'接続設定がまだです';$('status').textContent=(token?.email?'ログイン中：'+token.email:'未ログイン')+'\nログイン有効：あと'+Math.max(0,Math.ceil(((token?.expiresAt||0)-Date.now())/60000))+'分\n方式：'+methodName(method);for(const n of ['popup','redirect','write','read'])$(n).disabled=!enabled||busy||authBusy;$('logout').disabled=busy||authBusy||!token;$('auto').disabled=!enabled;$('resume').hidden=!pending||busy||authBusy;}
function renderChoices(){for(const [key,items,current] of [['devices',DEVICES,device],['networks',NETWORKS,network]])$(key).innerHTML=items.map(v=>`<button data-choice="${key}" data-value="${escapeHTML(v)}" aria-pressed="${v===current}">${escapeHTML(v)}</button>`).join('')}
function report(){return ['Google Sheets接続テスト '+VERSION,MOCK?'モック結果（実接続の確認ではありません）':'実接続結果','端末：'+(device||'未選択'),'回線：'+(network||'未選択'),'方式：'+methodName(method),'A〜Gの最終判定：結果記録_回答用.mdで端末・回線ごとに記入',...events.map(e=>`${e.time}｜${e.action}｜${e.ok?'成功':'失敗'}｜コード：${e.code||'なし'}｜${e.device||'未選択'}｜${e.network||'未選択'}｜${e.method}`)].join('\n')}
function showRows(){ $('rows').innerHTML=rows.slice(-20).reverse().map(r=>`<article class="${r[2]!==token?.email?'other':''}">${r[2]!==token?.email?'<strong>別のメールの記録</strong>':''}<p>${escapeHTML(r[0])}</p><p>${escapeHTML(r[2])}</p><p>${escapeHTML(r[3])} / ${escapeHTML(r[4])} / ${escapeHTML(r[5])}</p><p class="small">テストID：${escapeHTML(r[1])}</p></article>`).join('')||'<p>まだ記録はありません。</p>'}
function mockFailure(stage){const e=Q.get('mockError');if(!e)return;const auth=['admin_policy_enforced','org_internal','access_denied','popup_closed','popup_closed_by_user','cancel','popup_failed_to_open','redirect_uri_mismatch','origin_mismatch'];if(stage==='auth'&&auth.includes(e)||stage==='api'&&!auth.includes(e))throw Object.assign(new Error(),{code:e})}
function mockRows(){return get('mockRows',[[jpTime(),'example-other','other@example.test','Android・Chrome','モバイル回線','画面切替',VERSION,'モック']])}
async function request(url,options={}){try{const res=await fetch(url,{...options,credentials:'omit',headers:{Authorization:'Bearer '+token.accessToken,...options.headers},signal:AbortSignal.timeout(15000)});const body=await res.json().catch(()=>({}));if(!res.ok){const reason=body.error?.details?.find(x=>x.reason)?.reason;throw {code:reason||String(res.status)}}return body}catch(e){throw {code:e.code||'network_error'}}}
function apiURL(range){return 'https://sheets.googleapis.com/v4/spreadsheets/'+encodeURIComponent(CONFIG.spreadsheetId)+'/values/'+encodeURIComponent("'"+CONFIG.sheetName.replace(/'/g,"''")+"'!"+range)}
async function readValues(range){if(MOCK){mockFailure('api');if(range==='A1:H1')return [HEADERS];return mockRows()}return (await request(apiURL(range))).values||[]}
async function checkHeader(){const v=await readValues('A1:H1');if(!HEADERS.every((h,i)=>v[0]?.[i]===h))throw {code:'missing_header'}}
async function readRows(){if(!configured()||busy||authBusy)return;if(!valid()){error('401','読み込み');return}busy=true;renderStatus();try{await checkHeader();rows=await readValues('A2:H');showRows();record('読み込み',true);$('message').textContent='読み込みました（最新'+Math.min(rows.length,20)+'行）';}catch(e){if(e.code==='401'){token=null;put('token',null)}error(e.code,'読み込み')}finally{busy=false;renderStatus()}}
function savePending(p){if(!put('pending',p))throw {code:'storage_unavailable'};pending=p}
async function writeRow(resumed=false){if(!configured()||busy||authBusy)return;if(!device||!network){$('message').textContent='端末と回線を選んでください。';return}try{if(!pending)savePending({id:uuid(),time:jpTime(),device,network,method,attempts:0});if(!valid()){record('期限切れ・再ログイン開始',true);login(pending.method,true);return}busy=true;renderStatus();await checkHeader();const existing=await readValues('A2:H');if(existing.some(r=>r[1]===pending.id)){savePending(null);$('message').textContent='同じテストIDの行は保存済みでした。重ねて書き込みません。';record('保存済み確認',true);return}const p=pending,row=[p.time,p.id,token.email,p.device,p.network,methodName(p.method),VERSION,navigator.userAgent.slice(0,100)];let line;
if(MOCK){mockFailure('api');const all=mockRows();all.push(row);put('mockRows',all);line=all.length+1}else{let r;try{r=await request(apiURL('A:H')+':append?valueInputOption=RAW',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({values:[row]})})}catch(e){if(e.code==='network_error')throw {code:'uncertain_write'};throw e}line=r.updates?.updatedRange?.match(/![A-Z]+(\d+)/)?.[1]||'不明'}savePending(null);$('message').textContent='書き込みました（'+line+'行目）';record(resumed?'再ログイン後の書き込み':'書き込み',true);
}catch(e){if((e.code==='401'||e.code==='UNAUTHENTICATED')&&pending&&pending.attempts<1){token=null;put('token',null);pending.attempts++;savePending(pending);busy=false;record('401・再ログイン開始',true,'401');login(pending.method,true);return}error(e.code,'書き込み');}finally{busy=false;renderStatus()}}
async function acceptToken(t){if(!t.access_token||!Number.isFinite(+t.expires_in)||+t.expires_in<=0)throw {code:'invalid_token'};if(!MOCK&&!CONFIG.scopes.split(' ').every(s=>(t.scope||'').split(' ').includes(s)))throw {code:'missing_scope'};token={accessToken:t.access_token,expiresAt:Date.now()+Number(t.expires_in)*1000,email:'',clientId:CONFIG.clientId,spreadsheetId:CONFIG.spreadsheetId};try{token.email=MOCK?'me@example.test':(await request('https://www.googleapis.com/oauth2/v3/userinfo')).email;if(!token.email)throw {code:'missing_scope'};if(!put('token',token))throw {code:'storage_unavailable'};record('ログイン',true);$('message').textContent='ログインできました。';authBusy=false;renderStatus();if(pending)await writeRow(true)}catch(e){token=null;put('token',null);throw e}}
function login(which,resume=false){if(!configured()||busy||authBusy)return;method=which;put('method',method);if(pending){pending.method=method;if(!put('pending',pending)){error('storage_unavailable','ログイン');return}}authBusy=true;renderStatus();try{
if(MOCK){mockFailure('auth');const t={access_token:'mock-token',expires_in:Math.max(3,Number(Q.get('mockTokenSeconds'))||3600),scope:CONFIG.scopes};if(which==='redirect'){const state=uuid();if(!put('state',{value:state,time:Date.now()}))throw {code:'storage_unavailable'};location.assign(location.origin+location.pathname+location.search+'#'+new URLSearchParams({...t,state}));location.reload();return}void acceptToken(t).catch(e=>{authBusy=false;error(e.code,'ログイン')});return}
if(which==='redirect'){const state=uuid();if(!put('state',{value:state,time:Date.now()}))throw {code:'storage_unavailable'};const url=new URL('https://accounts.google.com/o/oauth2/v2/auth');url.search=new URLSearchParams({client_id:CONFIG.clientId,redirect_uri:location.origin+location.pathname,response_type:'token',scope:CONFIG.scopes,state,include_granted_scopes:'true',prompt:resume?'select_account':'consent'});location.assign(url.href);return}
if(!gis)throw {code:'gis_not_ready'};gis.requestAccessToken({prompt:resume?'':'consent'});
}catch(e){authBusy=false;error(e.code,'ログイン')}}
async function callback(){const h=new URLSearchParams(location.hash.slice(1));if(!h.has('access_token')&&!h.has('error'))return false;history.replaceState(null,'',location.pathname+location.search);token=null;put('token',null);const expected=get('state');put('state',null);if(!expected||h.get('state')!==expected.value||Date.now()-expected.time>600000){error('state_mismatch','ログイン');return true}if(h.has('error')){error(h.get('error'),'ログイン');return true}method='redirect';put('method',method);try{if(configured())await acceptToken(Object.fromEntries(h));else error('missing_config','ログイン')}catch(e){error(e.code,'ログイン')}return true}
function loadGIS(){if(MOCK||!configured())return;const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.async=true;s.onload=()=>{gis=google.accounts.oauth2.initTokenClient({client_id:CONFIG.clientId,scope:CONFIG.scopes,callback:r=>{if(r.error){authBusy=false;error(r.error,'ログイン');return}void acceptToken(r).catch(e=>{authBusy=false;error(e.code,'ログイン')})},error_callback:e=>{authBusy=false;error(e.type||'popup_closed','ログイン')}})};s.onerror=()=>error('network_error','ログイン準備');document.head.append(s)}
$('devices').onclick=$('networks').onclick=e=>{const b=e.target.closest('[data-choice]');if(!b||busy||authBusy)return;if(b.dataset.choice==='devices'){device=b.dataset.value;put('device',device)}else{network=b.dataset.value;put('network',network)}renderChoices()};
$('popup').onclick=()=>login('popup');$('redirect').onclick=()=>login('redirect');$('write').onclick=()=>void writeRow();$('read').onclick=()=>void readRows();$('resume').onclick=()=>login(method,true);
$('logout').onclick=()=>{token=null;pending=null;put('token',null);put('pending',null);put('state',null);rows=[];showRows();$('auto').checked=false;clearInterval(autoTimer);record('ログアウト',true);$('message').textContent='このタブのログイン情報を破棄しました。';renderStatus()};
$('auto').onchange=()=>{clearInterval(autoTimer);if($('auto').checked)autoTimer=setInterval(()=>{if(valid())void readRows();else{$('message').textContent='ログイン切れのため自動読み込みを停止しています。ログインボタンを押してください。';renderStatus()}},CONFIG.pollSeconds*1000)};
$('copy').onclick=async()=>{const text=report();$('report').value=text;try{await navigator.clipboard.writeText(text);$('message').textContent='結果をコピーしました。'}catch{$('report').hidden=false;$('report').select();$('message').textContent='自動コピーできません。下の結果を選択してコピーしてください。'}};
renderChoices();renderStatus();setInterval(renderStatus,1000);const ready=(async()=>{await callback();loadGIS();renderStatus()})();
</script></body></html>
